name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_MODE: deterministic
  AI_PROVIDER: ollama
  RUNBOOK_RETRIEVAL: lexical
  LANGSMITH_TRACING: "false"
  RUN_LLM_TESTS: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Ruff lint
        run: ruff check src tests scripts --output-format=github

      - name: Unit tests with branch coverage
        run: |
          pytest -q \
            --ignore=tests/test_incident_workflow_integration.py \
            --cov=incident_commander \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=70

      - name: Add coverage to job summary
        if: ${{ matrix.python-version == '3.12' && always() }}
        shell: bash
        run: |
          if [ -f coverage.xml ]; then
            COVERAGE=$(python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          print(f"{float(root.attrib['line-rate']) * 100:.1f}")
          PY
          )
            echo "### Python line coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Deterministic integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run API + HITL integration tests
        run: pytest -q tests/test_incident_workflow_integration.py

  docker-smoke:
    name: Hardened Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, integration]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: agentic-incident-commander:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run hardened container smoke test
        shell: bash
        run: bash scripts/ci_docker_smoke.sh

      - name: Upload container logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-logs
          path: docker-smoke.log
          if-no-files-found: ignore
          retention-days: 7

