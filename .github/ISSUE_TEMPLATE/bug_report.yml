name: Bug report
description: Report a reproducible defect in the incident commander.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Set environment variables...
        2. Run command...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: AI mode
      options:
        - deterministic
        - llm / Ollama
        - llm / OpenAI
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
