name: Feature request
description: Suggest an improvement to the project.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior or architecture.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety / HITL considerations
      description: Could this affect tool execution, approval gates, or remediation?
