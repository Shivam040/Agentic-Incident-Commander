[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-incident-commander"
version = "0.4.0"
description = "Observable agentic incident response with LangGraph, MCP, semantic RAG, durable HITL, CI/CD, and evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "langgraph>=1.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain[mcp]>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langsmith>=0.4.25",
    "fastmcp>=2.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.9",
]
openai = ["langchain-openai>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
